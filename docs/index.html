<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HKUST Booking</title>
<style>
:root { --bg: #f7f7f5; --card: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0; --accent: #2563eb; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #111113; --card: #1c1c1f; --fg: #ececf0; --muted: #9a9aa2; --line: #2e2e33; --accent: #60a5fa; }
}
* { box-sizing: border-box; }
body { margin: 0 auto; max-width: 640px; padding: 32px 16px; background: var(--bg); color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
h1 { font-size: 22px; margin: 0 0 4px; }
p.sub { color: var(--muted); margin: 0 0 24px; }
a.card, div.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 16px 18px; margin-bottom: 12px; color: inherit; text-decoration: none; }
a.card:hover { border-color: var(--accent); }
.card h2 { font-size: 17px; margin: 0 0 2px; }
.card p { margin: 0; color: var(--muted); font-size: 13px; }
div.card { opacity: .55; }
.tag { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; font-weight: 400; }
</style>
</head>
<body>
<h1>HKUST Booking</h1>
<p class="sub">校内预约占用情况</p>
<a class="card" href="library/">
  <h2>Library</h2>
  <p>Group Study Rooms · LC Study Rooms · Study Pods</p>
</a>
<div class="card">
  <h2>Facility <span class="tag">即将上线</span></h2>
  <p>篮球场等体育设施</p>
</div>
</body>
</html>
